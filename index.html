    span: "", title: "DTY Trung Quốc (Qianqing) 150D/48F", unit: S.dty.unit,
    cadence: cadence(FREQ.session, dmy(S.dty.as_of), "emerging"),
    body: chartBox({
      kind: "line", xkind: "time", yDec: 0, yUnit: "Yuan/MT",
      xTicks: timeTicks(ts(S.dty.d[0]), ts(S.dty.as_of), 7),
      series: (trDty ? [trDty] : []).concat([{ name: "DTY Trung Quốc (Qianqing) 150D/48F", color: css("--series-5"), pts: pts(S.dty), w: 1.75, endDot: true }])
    }, 220) + (trDty ? legend([{ c: css("--ink3-panel"), n: "Xu hướng (hồi quy tuyến tính, nét đứt)" }]) : ""),
    note: "Đơn vị <span class=\"mono\">Yuan/MT</span> khác ba biểu đồ trên nên để biểu đồ riêng — không dùng hai trục y."
  }), true);
  return h + "</div>";
}

/* =====================================================================
   10b. SUB-TAB 2.5 — SỢI (thêm 18/09/2026)
   4 phần theo thiết kế đã duyệt: 1 Biên kéo sợi · 2 Cung–cầu Trung Quốc ·
   3 Tồn kho & vận hành · 4 Vị thế Việt Nam.
   Dữ liệu nằm ở DOCUMENT RIÊNG `{coll}/soi` — cố ý KHÔNG nhét vào trends.groups
   vì trần 256 KiB/document của Artifact Database.
   ĐƠN VỊ: đọc TRỰC TIẾP trường `unit` của từng chuỗi trong document (giống `S.brent_ice.unit`
   ở sub-tab Xơ) — KHÔNG khai lại bảng đơn vị cứng trong trang. Đơn vị đã được xác nhận trực
   tiếp trên nguồn ngày 18/09/2026; nếu sau này nguồn đổi đơn vị, sửa ở consolidator là trang
   tự đúng theo, không phải sửa hai nơi.
   ===================================================================== */
function viewSoi() {
  const s = DATA.soi;
  if (!s) return noData("Sợi");
  const P1 = s.phan1_bien_keo_soi || {}, C = P1.cotton || {}, G = P1.gia_soi || {},
    PE = P1.pe_reference || {}, M = P1.method || {},
    P3 = s.phan3_tonkho_vanhanh || {}, TK = P3.tonkho || {}, VH = P3.vanhanh || {},
    R2 = s.phan2_cungcau_tq || [];

  /* ---- tiện ích cục bộ ---- */
  function step(nn, lbl, inner, last) {
    return '<div class="chain"><div class="chain-step"><span class="n">' + nn + '</span><span class="lbl">' + lbl + "</span>" +
      (last ? "" : '<span class="chev">▾</span>') + "</div><div>" + inner + "</div></div>";
  }
  function partHd(k, title, desc) {
    return '<div class="part-hd"><span class="k">' + esc(k) + "</span><h2>" + esc(title) + "</h2>" +
      (desc ? "<p>" + desc + "</p>" : "") + "</div>";
  }
  const has = (o) => !!(o && o.v && o.v.length);
  /** đơn vị của 1 chuỗi — luôn lấy từ document, không có thì để trống (không tự đặt tên đơn vị) */
  const U = (o) => (o && o.unit) ? o.unit : "";
  /** đơn vị chung của 1 nhóm chuỗi vẽ trên CÙNG một trục: các chuỗi phải cùng đơn vị, nếu
   *  nguồn đổi khiến chúng lệch nhau thì hiện đủ các đơn vị khác nhau thay vì chọn bừa một cái */
  const uAll = (list) => {
    const u = [];
    (list || []).forEach(o => { const x = U(o); if (x && u.indexOf(x) < 0) u.push(x); });
    return u.join(" · ");
  };
  const isMonth = (k) => /^\d{4}-\d{2}$/.test(String(k));
  const kyTick = (k) => String(k).slice(5) + "/" + String(k).slice(2, 4);
  const kyFull = (k) => String(k).slice(5) + "/" + String(k).slice(0, 4);
  /** chênh lệch so mốc cách `days` ngày lịch gần nhất trong chính chuỗi (null nếu chưa đủ dài) */
  function dlt(o, days) {
    if (!has(o)) return null;
    const n = o.v.length, lastT = ts(o.d[n - 1]);
    for (let i = n - 1; i >= 0; i--) if (lastT - ts(o.d[i]) >= days * 86400000) return o.v[n - 1] - o.v[i];
    return null;
  }
  /** nén chuỗi đã forward-fill theo ngày về đúng các BẬC thật (giá trị đổi) — cùng cách
   *  AWP ở mục 2.3 được dựng; nếu không nén, chart bậc thang vẽ 1 chấm/ngày, đọc không ra. */
  function stepsOf(o) {
    const d = [], v = [], n = o.d.length;
    for (let i = 0; i < n; i++) if (i === 0 || o.v[i] !== o.v[i - 1]) { d.push(o.d[i]); v.push(o.v[i]); }
    if (d[d.length - 1] !== o.d[n - 1]) { d.push(o.d[n - 1]); v.push(o.v[n - 1]); }
    return { d: d, v: v, as_of: o.as_of, label: o.label };
  }
  function monthly(ct, pl) {
    return R2.filter(r => r.chi_tieu === ct && r.phan_loai === pl && isMonth(r.ky))
      .sort((a, b) => a.ky < b.ky ? -1 : 1);
  }
  function byCountry(ct) {
    const all = R2.filter(r => r.chi_tieu === ct && !isMonth(r.ky) && r.phan_loai !== "Tổng");
    return {
      ky: all.length ? all[0].ky : null,
      total: all.find(r => r.phan_loai === "Total") || null,
      rows: all.filter(r => r.phan_loai !== "Total").sort((a, b) => (b.khoi_luong || 0) - (a.khoi_luong || 0))
    };
  }
  /** thanh ngang tự vẽ (cùng lối SVG nội tuyến với figPairbars/figBignum §4.7) */
  function figHBars(items, aria) {
    if (!items.length) return panelMissing("Chưa có dữ liệu phân rã theo quốc gia.");
    const max = Math.max.apply(null, items.map(it => it.v || 0)) || 1;
    const W = 640, labW = 150, valW = 96, rowH = 23, H = items.length * rowH + 6, barW = W - labW - valW;
    let g = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(aria || "") +
      '" style="display:block;width:100%;height:auto">';
    items.forEach((it, i) => {
      const y = i * rowH + 3, w = Math.max(2, barW * ((it.v || 0) / max));
      g += '<text x="0" y="' + (y + 12) + '" fill="' + (it.hl ? css("--ink1-panel") : css("--ink2-panel")) +
        '" font-family="' + css("--font-ui") + '" font-size="11.5"' + (it.hl ? ' font-weight="600"' : "") + ">" +
        esc(it.label) + "</text>";
      g += '<rect x="' + labW + '" y="' + y + '" width="' + barW + '" height="15" fill="' + css("--panel-inset") + '"/>';
      g += '<rect x="' + labW + '" y="' + y + '" width="' + w.toFixed(1) + '" height="15" rx="2" fill="' +
        (it.hl ? css("--series-2") : css("--series-1")) + '"/>';
      g += '<text x="' + W + '" y="' + (y + 12) + '" text-anchor="end" fill="' +
        (it.hl ? css("--ink1-panel") : css("--ink2-panel")) + '" font-family="' + css("--font-mono") +
        '" font-size="11.5">' + nInt(it.v) + "</text>";
    });
    return g + "</svg>";
  }
  function lineChart(series, cfg, h) {
    return chartBox(Object.assign({ kind: "line", xkind: "time", series: series }, cfg), h || 240);
  }

  /* ---- đầu trang + ghi chú phạm vi dữ liệu ----
     `data_gap_warning` của document nay chỉ còn là CÔNG BỐ PHẠM VI (2/7 nhóm chi-số, chưa có
     nhóm XNK hải quan VN) — không còn điểm nào đáng báo động, nên hiển thị bằng dòng ghi chú
     nhỏ trung tính `.frame-label`, KHÔNG dùng thẻ cảnh báo. Vẫn phải hiện, không được bỏ. */
  let h = pageHd("Diễn biến thị trường · Sợi", "Sợi — biên kéo sợi & cung–cầu",
    "Kéo 1 kg sợi từ bông hôm nay còn lại bao nhiêu, và thị trường sợi lớn nhất thế giới đang dư hay thiếu?",
    "<b>Khung hiển thị: 12 tháng gần nhất</b> cho các chuỗi theo ngày/tuần; riêng sản lượng Trung Quốc giữ nguyên chuỗi tháng dài từ 01/2023. " +
    "Bố cục: phần 1 đọc theo chuỗi giá trị (bông → sợi) như " + jump(1, 3, "sub-tab 2.4 Xơ") +
    "; ba phần còn lại là các bảng đối chiếu song song như " + jump(1, 2, "sub-tab 2.3 Bông") + ".");
  if (s.data_gap_warning) {
    h += '<p class="frame-label" style="margin:-8px 0 16px"><b>Phạm vi dữ liệu:</b> ' +
      esc(s.data_gap_warning) + " Giá sợi Trung Quốc niêm yết bằng đơn vị khác nhóm còn lại nên " +
      "được vẽ trên biểu đồ riêng, trang không quy đổi sang cùng đơn vị.</p>";
  }

  /* =================== PHẦN 1 — BIÊN KÉO SỢI =================== */
  h += partHd("Phần 1", "Biên kéo sợi (bông → sợi cotton 32s chải thô)",
    "Ba đường trên cùng một biểu đồ, <b>không gộp</b>: hai đường tự tính của bàn và một đường chuẩn đối chiếu của CCFGroup. " +
    "Giữ cả ba để thấy ngay khi cách tính của bàn lệch khỏi chuẩn bên ngoài — đúng cách trang này xử lý cặp Brent kép ở " +
    jump(1, 1, "mục 2.2") + ".");
  h += "<div>";

  /* 01 — tham số phương pháp */
  const th = M.tieu_hao_cd, cg = M.cp_gia_cong;
  let mBody = "";
  if (has(th) || has(cg)) {
    mBody += '<div class="tiles tiles-3">' +
      '<div class="tile"><span class="tile-label">Hệ số tiêu hao bông CD</span><span class="tile-value">' +
      (has(th) ? n2(th.v[th.v.length - 1], 4) : "—") + '<span class="tile-unit">' + esc(U(th)) + '</span></span>' +
      '<span class="tile-note">' + (has(th) ? dmy(th.as_of) : "chưa có") + "</span></div>" +
      '<div class="tile"><span class="tile-label">Chi phí gia công sợi</span><span class="tile-value">' +
      (has(cg) ? n2(cg.v[cg.v.length - 1], 4) : "—") + '<span class="tile-unit">' + esc(U(cg)) + '</span></span>' +
      '<span class="tile-note">' + (has(cg) ? dmy(cg.as_of) : "chưa có") + "</span></div>" +
      "</div>";
    mBody += '<div class="sm sm-2" style="margin-top:14px">' +
      '<div class="sm-cell"><h4>Hệ số tiêu hao bông CD ' + unitTag(U(th)) + "</h4>" +
      (has(th) ? chartBox({
        kind: "line", xkind: "time", yDec: 3, yUnit: U(th), padL: 50,
        xTicks: timeTicks(ts(th.d[0]), ts(th.as_of), 4),
        series: [{ name: "Hệ số tiêu hao bông CD", color: css("--series-4"), w: 2, step: true, pts: pts(stepsOf(th)) }]
      }, 190) : panelMissing("Chưa có dữ liệu.")) + "</div>" +
      '<div class="sm-cell"><h4>Chi phí gia công sợi ' + unitTag(U(cg)) + "</h4>" +
      (has(cg) ? chartBox({
        kind: "line", xkind: "time", yDec: 3, yUnit: U(cg), padL: 50,
        xTicks: timeTicks(ts(cg.d[0]), ts(cg.as_of), 4),
        series: [{ name: "Chi phí gia công sợi", color: css("--series-6"), w: 2, step: true, pts: pts(stepsOf(cg)) }]
      }, 190) : panelMissing("Chưa có dữ liệu.")) + "</div></div>";
  } else mBody = panelMissing("Chưa có tham số phương pháp cho kỳ này.");
  h += step("01", "Tham số", panel({
    span: "", title: "Hai tham số quyết định biên" + chip("số kỹ thuật nội bộ · bình quân gia quyền theo sản lượng"),
    cadence: cadence(FREQ.month, has(th) ? dmy(th.as_of) : "—", "banSoi"),
    body: mBody,
    note: "Hai tham số này chỉ đổi <b>theo tháng</b> nên vẽ dạng bậc thang — mỗi bậc giữ nguyên tới lần cập nhật kế tiếp, " +
      "đúng như cách " + jump(1, 2, "AWP ở mục 2.3") + " được vẽ. Hệ số tiêu hao và chi phí gia công là bình quân gia quyền " +
      "theo sản lượng sản xuất của các đơn vị kéo sợi, không phải giả định chung của ngành."
  }));

  /* 02 — biên kéo sợi (3 đường) */
  const bg = C.bien_gop, br = C.bien_rong, bc = C.bien_ccf;
  let bBody = "", bNote = "";
  if (has(bg) || has(br) || has(bc)) {
    const ser = [];
    if (has(bg)) ser.push({ name: (bg.label || "Biên gộp"), ticker: "Gộp", color: css("--series-1"), w: 1.75, pts: pts(bg), endDot: true });
    if (has(br)) ser.push({ name: (br.label || "Biên ròng"), ticker: "Ròng", color: css("--series-3"), w: 2.5, pts: pts(br), endDot: true });
    if (has(bc)) ser.push({ name: (bc.label || "Biên CCFGroup"), ticker: "CCF", color: css("--series-2"), w: 1.75, pts: pts(bc), endDot: true });
    const last = has(bc) ? bc : (has(br) ? br : bg);
    bBody = '<div class="tiles tiles-3">' +
      ["bien_gop", "bien_rong", "bien_ccf"].map(k => {
        const o = C[k], nm = k === "bien_gop" ? "Biên gộp (tự tính)" : k === "bien_rong" ? "Biên ròng (tự tính)" : "Biên CCFGroup (đối chiếu)";
        if (!has(o)) return '<div class="tile"><span class="tile-label">' + esc(nm) +
          '</span><span class="tile-value is-empty">—</span><span class="tile-note">chưa có dữ liệu</span></div>';
        return '<div class="tile"><span class="tile-label">' + esc(nm) + '</span><span class="tile-value">' +
          n2(o.v[o.v.length - 1], 3) + '<span class="tile-unit">USD/kg</span></span>' +
          deltaHtml(dlt(o, 30), 3, "USD/kg so ~30 ngày trước", "margin", 0.0005) +
          '<span class="tile-note">' + dmy(o.as_of) + "</span></div>";
      }).join("") + "</div>";
    bBody += chartBox({
      kind: "line", xkind: "time", yDec: 2, yUnit: uAll([bg, br, bc]), ttDec: 3, endLabels: true, padR: 62, padL: 50,
      xTicks: timeTicks(ts(last.d[0]), ts(last.as_of), 7),
      series: ser
    }, 330);
    bBody += legend([
      { c: css("--series-1"), tk: "Gộp", n: "biên gộp — tự tính, chưa trừ chi phí gia công" },
      { c: css("--series-3"), tk: "Ròng", n: "biên ròng — tự tính, đã trừ chi phí gia công" },
      { c: css("--series-2"), tk: "CCF", n: "biên lợi nhuận sợi 32s Việt Nam (air-jet) — chuẩn đối chiếu bên ngoài" }
    ]);
    bNote = "<b>Cách tính, ghi rõ để kiểm chứng lại được:</b> biên gộp = giá sợi cotton 32s Việt Nam − " +
      "(giá bông Cotlook A Index × hệ số tiêu hao bông CD); biên ròng = biên gộp − chi phí gia công sợi. " +
      "Đường CCFGroup <b>không</b> dùng công thức của bàn (nhà cung cấp không công bố công thức) nên chỉ đóng vai " +
      "<b>chuẩn đối chiếu độc lập</b> — hai đường tự tính bám sát được đường này là dấu hiệu chuỗi tham số vào đúng, " +
      "không phải là bằng chứng công thức giống nhau. Ba đường <b>không gộp, không lấy trung bình</b>. " +
      "Biên nới ra là <b>có lợi</b> cho khâu kéo sợi, nên tô màu theo chiều đó." +
      (has(bg) && has(bc) && bg.as_of !== bc.as_of
        ? " Hai đường tự tính dừng ở <span class=\"mono\">" + dmy(bg.as_of) +
          "</span> vì tham số kỹ thuật mới cập nhật tới đó, trong khi đường CCFGroup đã tới <span class=\"mono\">" +
          dmy(bc.as_of) + "</span> — đoạn cuối biểu đồ chỉ còn 1 đường là đúng, không phải mất dữ liệu."
        : "");
  } else bBody = panelMissing("Chưa có chuỗi biên kéo sợi cho kỳ này.");
  h += step("02", "Biên", panel({
    span: "", title: "Biên kéo sợi — 3 đường song song", unit: uAll([bg, br, bc]),
    cadence: cadence(FREQ.session,
      (has(bg) ? dmy(bg.as_of) + " (tự tính)" : "—") + (has(bc) ? " · " + dmy(bc.as_of) + " (CCFGroup)" : ""),
      "soiDesk"),
    body: bBody, note: bNote
  }));

  /* 03 — tham chiếu PE (chỉ Trung Quốc) */
  const peChip = chip("CHỈ Trung Quốc — không phải Việt Nam");
  let peInner = "";
  if (has(PE.price_32s) || has(PE.price_cvc)) {
    const sp = [];
    if (has(PE.price_32s)) sp.push({ name: PE.price_32s.label, ticker: "PE 32s", color: css("--series-1"), w: 1.75, pts: pts(PE.price_32s), endDot: true });
    if (has(PE.price_cvc)) sp.push({ name: PE.price_cvc.label, ticker: "CVC", color: css("--series-5"), w: 1.75, pts: pts(PE.price_cvc), endDot: true });
    const ref = has(PE.price_32s) ? PE.price_32s : PE.price_cvc;
    peInner += panel({
      span: "", title: "Giá sợi PE 32s &amp; CVC 60/40 Trung Quốc" + peChip, unit: uAll([PE.price_32s, PE.price_cvc]),
      cadence: cadence(FREQ.session, dmy(ref.as_of), "ccf"),
      body: chartBox({
        kind: "line", xkind: "time", yDec: 0, yUnit: uAll([PE.price_32s, PE.price_cvc]), endLabels: true, padR: 70, padL: 56,
        xTicks: timeTicks(ts(ref.d[0]), ts(ref.as_of), 7), series: sp
      }, 240) + legend([
        { c: css("--series-1"), tk: "PE 32s", n: "sợi PE 32s Trung Quốc" },
        { c: css("--series-5"), tk: "CVC", n: "sợi pha CVC 60/40 32s Trung Quốc" }
      ]),
      note: "Đơn vị <span class=\"mono\">" + esc(uAll([PE.price_32s, PE.price_cvc])) + "</span> — khác hẳn nhóm giá " +
        "<span class=\"mono\">" + esc(uAll([G.vn_32s])) + "</span> ở phần 4, nên để biểu đồ riêng, <b>không</b> quy đổi."
    });
  }
  if (has(PE.spread) || has(PE.profit)) {
    const sp2 = [];
    if (has(PE.spread)) sp2.push({ name: PE.spread.label, ticker: "Spread", color: css("--series-4"), w: 1.75, pts: pts(PE.spread), endDot: true });
    if (has(PE.profit)) sp2.push({ name: PE.profit.label, ticker: "Lợi nhuận", color: css("--series-2"), w: 2, pts: pts(PE.profit), endDot: true });
    const ref2 = has(PE.spread) ? PE.spread : PE.profit;
    peInner += panel({
      span: "", title: "Chênh lệch gia công &amp; biên lợi nhuận sợi PE Trung Quốc" + peChip, unit: uAll([PE.spread, PE.profit]),
      cadence: cadence(FREQ.session, dmy(ref2.as_of), "ccf"),
      body: chartBox({
        kind: "line", xkind: "time", yDec: 0, yUnit: uAll([PE.spread, PE.profit]), endLabels: true, padR: 78, padL: 56,
        xTicks: timeTicks(ts(ref2.d[0]), ts(ref2.as_of), 7), series: sp2
      }, 240) + legend([
        { c: css("--series-4"), tk: "Spread", n: "chênh lệch giá gia công sợi PE" },
        { c: css("--series-2"), tk: "Lợi nhuận", n: "biên lợi nhuận sợi PE 32s" }
      ]),
      note: "<b>Đây là số liệu Trung Quốc, dùng làm bối cảnh cạnh tranh — trang này KHÔNG có biên kéo sợi PE của " +
        "Việt Nam/Vinatex và cũng không tự dựng một con số như vậy.</b> Biên kéo sợi tự tính ở bước 02 chỉ áp cho " +
        "tuyến bông → sợi cotton. Cặp đường này để trung tính về màu: giá gia công PE rẻ đi vừa là áp lực cạnh tranh, " +
        "vừa là cơ hội đầu vào tuỳ vai trò của đơn vị đọc."
    });
  }
  if (!peInner) peInner = panel({ span: "", title: "Tham chiếu sợi PE Trung Quốc" + peChip, body: panelMissing("Chưa có dữ liệu.") });
  h += step("03", "Tham chiếu PE", '<div style="display:grid;gap:16px">' + peInner + "</div>", true);
  h += "</div>";

  /* =================== PHẦN 2 — CUNG–CẦU TRUNG QUỐC =================== */
  h += '<div class="grid">';
  h += partHd("Phần 2", "Cung–cầu sợi cotton Trung Quốc (theo tháng)",
    "Thị trường tiêu thụ và cạnh tranh lớn nhất của sợi Việt Nam. Vai trò của phần này giống vai trò của " +
    jump(0, 1, "bản tin WASDE") + " với bông: khung cung–cầu để đọc giá, không phải giá.");

  const CT_SX = "Sản lượng sợi cotton (Trung Quốc)";
  const CT_NK = "Nhập khẩu sợi cotton (Trung Quốc)";
  const CT_NK_CS = R2.map(r => r.chi_tieu).find(x => x.indexOf("chỉ 2/7 nhóm chi-số") >= 0) || "";
  const sx = monthly(CT_SX, "Tổng");
  h += panel({
    span: "s12", title: "Sản lượng sợi cotton Trung Quốc theo tháng",
    unit: sx.length ? sx[0].don_vi : "—",
    cadence: cadence(FREQ.month, sx.length ? kyFull(sx[sx.length - 1].ky) : "—", "ccf"),
    body: sx.length ? chartBox({
      kind: "line", xkind: "band", yDec: 0, yUnit: sx[0].don_vi, ttDec: 0, padL: 50,
      xTicks: sx.map((r, i) => ({ x: i, label: kyTick(r.ky) })).filter((_, i) => i % 3 === 0),
      series: [{
        name: "Sản lượng sợi cotton (Trung Quốc)", color: css("--series-1"), w: 1.75, endDot: true,
        pts: sx.map((r, i) => ({ x: i, v: r.khoi_luong, label: kyFull(r.ky) }))
      }]
    }, 260) : panelMissing("Chưa có dữ liệu sản lượng."),
    note: "Đơn vị lấy nguyên văn từ nguồn: <span class=\"mono\">" + esc(sx.length ? sx[0].don_vi : "—") +
      "</span>. Chuỗi để trung tính về màu: sản lượng Trung Quốc tăng vừa là cung sợi dồi dào hơn (ép giá bán) " +
      "vừa là cầu bông mạnh hơn — hai hệ quả ngược chiều nhau với một tập đoàn vừa mua bông vừa bán sợi."
  });

  const nkT = monthly(CT_NK, "Tổng"), nkC = CT_NK_CS ? monthly(CT_NK_CS, "Tổng") : [];
  const axis = nkT.length ? nkT : nkC;
  let nkSer = [];
  if (nkT.length) nkSer.push({
    name: CT_NK, ticker: "Tổng", color: css("--series-1"), w: 2, endDot: true,
    pts: axis.map((r, i) => { const m = nkT.find(q => q.ky === r.ky); return { x: i, v: m ? m.khoi_luong : null, label: kyFull(r.ky) }; })
  });
  if (nkC.length) nkSer.push({
    name: CT_NK_CS, ticker: "2/7 chi-số", color: css("--series-4"), w: 1.75, endDot: true,
    pts: axis.map((r, i) => { const m = nkC.find(q => q.ky === r.ky); return { x: i, v: m ? m.khoi_luong : null, label: kyFull(r.ky) }; })
  });
  h += panel({
    span: "s12", title: "Nhập khẩu sợi cotton của Trung Quốc theo tháng", unit: axis.length ? axis[0].don_vi : "",
    cadence: cadence(FREQ.month, axis.length ? kyFull(axis[axis.length - 1].ky) : "—", "ccf"),
    body: axis.length ? chartBox({
      kind: "line", xkind: "band", yDec: 0, yUnit: axis[0].don_vi, ttDec: 0, padL: 62,
      xTicks: axis.map((r, i) => ({ x: i, label: kyTick(r.ky) })),
      series: nkSer
    }, 260) + legend([
      { c: css("--series-1"), tk: "Tổng", n: "tổng nhập khẩu sợi cotton" },
      { c: css("--series-4"), tk: "2/7 chi-số", n: "phần đã bóc tách được theo chi số sợi" }
    ]) : panelMissing("Chưa có dữ liệu nhập khẩu theo tháng."),
    note: "<b>Giới hạn phạm vi của đường thứ hai, nguyên văn từ bộ dữ liệu:</b> <span class=\"scope-chip\">" +
      esc(CT_NK_CS || "—") + "</span> — tức đường này <b>không</b> phải toàn bộ cơ cấu chi số, mới bóc tách được " +
      "2 trong 7 nhóm, nên khoảng cách giữa hai đường <b>không</b> đọc được thành \"các chi số còn lại\". " +
      "Chuỗi chỉ mới có từ 01/2026."
  });

  [[CT_NK, "Nhập khẩu — theo nước xuất xứ", "Việt Nam đứng ở đâu trong nguồn cung sợi cho Trung Quốc"],
   ["Xuất khẩu sợi cotton (Trung Quốc)", "Xuất khẩu — theo nước đến", "Sợi Trung Quốc đang cạnh tranh với sợi Việt Nam ở những thị trường nào"]
  ].forEach(cfg => {
    const d = byCountry(cfg[0]);
    const items = d.rows.slice(0, 12).map(r => ({
      label: r.phan_loai === "Vietnam" ? "Việt Nam" : r.phan_loai,
      v: r.khoi_luong, hl: r.phan_loai === "Vietnam"
    }));
    const vn = d.rows.find(r => r.phan_loai === "Vietnam");
    const vnRank = vn ? d.rows.indexOf(vn) + 1 : null;
    const tot = d.total && d.total.khoi_luong;
    const dvi = (d.total && d.total.don_vi) || (d.rows[0] && d.rows[0].don_vi) || "";
    h += panel({
      span: "s6", title: esc(cfg[1]) + chip("luỹ kế"), unit: dvi,
      cadence: cadence(FREQ.month, d.ky ? String(d.ky) : "—", "ccf"),
      body: figHBars(items, cfg[1]) +
        (tot ? '<p class="chart-note"><b>Tổng cộng tất cả các nước:</b> <span class="mono">' + nInt(tot) +
          "</span> " + esc(dvi) + (d.total.gia_tri_usd ? ' · <span class="mono">' + nInt(d.total.gia_tri_usd) + "</span> USD" : "") +
          (vn ? " · Việt Nam <span class=\"mono\">" + nInt(vn.khoi_luong) + "</span> " + esc(dvi) + " (" +
            n2(vn.khoi_luong / tot * 100, 1) + "% tổng, hạng " + vnRank + ")" : "") + "</p>" : ""),
      note: esc(cfg[2]) + ". Biểu đồ hiện <b>12 nước lớn nhất</b> trong " + d.rows.length +
        " nước có số liệu; thanh tô đậm là Việt Nam. Kỳ số liệu ghi nguyên văn từ nguồn: <span class=\"mono\">" +
        esc(String(d.ky || "—")) + "</span> — đây là số <b>luỹ kế</b>, không phải một tháng, nên không đặt cạnh " +
        "hai biểu đồ theo tháng ở trên để so sánh trực tiếp."
    });
  });

  /* =================== PHẦN 3 — TỒN KHO & VẬN HÀNH =================== */
  h += partHd("Phần 3", "Tồn kho & vận hành (theo tuần)",
    "Chỉ báo sớm nhất của áp lực giá sợi: hàng đang nằm ở đâu và nhà máy đang chạy bao nhiêu phần công suất.");

  const tkDay = [["spinning", "--series-1"], ["fabric", "--series-3"], ["pe_spinning", "--series-5"]]
    .filter(k => has(TK[k[0]]));
  h += panel({
    span: "s12", title: "Tồn kho sợi tại nhà máy — kéo sợi · dệt · sợi PE", unit: uAll(tkDay.map(k => TK[k[0]])),
    cadence: cadence(FREQ.week, tkDay.length ? dmy(TK[tkDay[0][0]].as_of) : "—", "ccf"),
    body: tkDay.length ? chartBox({
      kind: "line", xkind: "time", yDec: 0, yUnit: U(TK[tkDay[0][0]]), ttDec: 1, endLabels: true, padR: 66, padL: 44,
      xTicks: timeTicks(ts(TK[tkDay[0][0]].d[0]), ts(TK[tkDay[0][0]].as_of), 7),
      series: tkDay.map(k => ({
        name: TK[k[0]].label, ticker: k[0] === "spinning" ? "Kéo sợi" : k[0] === "fabric" ? "Dệt" : "PE",
        color: css(k[1]), w: 1.75, pts: pts(TK[k[0]]), endDot: true
      }))
    }, 280) + legend(tkDay.map(k => ({ c: css(k[1]), n: TK[k[0]].label }))) : panelMissing("Chưa có dữ liệu tồn kho."),
    note: "Ba chuỗi cùng đơn vị <span class=\"mono\">" + esc(uAll(tkDay.map(k => TK[k[0]]))) + "</span> nên dùng <b>một trục duy nhất</b>. " +
      "Nhóm này để <b>trung tính về màu</b>: tồn kho sợi tại Trung Quốc dày lên là áp lực giảm giá sợi (xấu cho đơn vị bán sợi) " +
      "nhưng cũng là dấu hiệu nguồn cung sẵn (tốt cho đơn vị mua sợi) — tô xanh/đỏ ở đây là nói sai bằng màu."
  });

  const pt = TK.port;
  h += panel({
    span: "s12", title: "Tồn kho sợi cotton nhập khẩu tại cảng Trung Quốc" + chip("đơn vị khác 3 chuỗi trên"),
    unit: U(pt),
    cadence: cadence(FREQ.week, has(pt) ? dmy(pt.as_of) : "—", "ccf"),
    body: has(pt) ? chartBox({
      kind: "line", xkind: "time", yDec: 1, yUnit: U(pt), ttDec: 2, padL: 44,
      xTicks: timeTicks(ts(pt.d[0]), ts(pt.as_of), 7),
      series: [{ name: pt.label, color: css("--series-2"), w: 1.75, pts: pts(pt), endDot: true }]
    }, 220) : panelMissing("Chưa có dữ liệu tồn kho cảng."),
    note: "Chuỗi này đo <b>khối lượng</b> (" + esc(U(pt)) + "), ba chuỗi ở biểu đồ trên đo <b>số ngày tồn</b> — " +
      "hai thước đo khác nhau nên tách hẳn biểu đồ, không dùng hai trục y và không vẽ chung."
  });

  const vhK = [["vn", "--series-1", "Việt Nam"], ["cn_cotton", "--series-2", "TQ · cotton"], ["cn_pe", "--series-5", "TQ · PE"]]
    .filter(k => has(VH[k[0]]));
  h += panel({
    span: "s12", title: "Tỷ lệ vận hành nhà máy kéo sợi — Việt Nam &amp; Trung Quốc", unit: uAll(vhK.map(k => VH[k[0]])),
    cadence: cadence(FREQ.week, vhK.length ? dmy(VH[vhK[0][0]].as_of) : "—", "ccf"),
    body: vhK.length ? chartBox({
      kind: "line", xkind: "time", yDec: 0, yUnit: U(VH[vhK[0][0]]), ttDec: 1, endLabels: true, padR: 72, padL: 40,
      xTicks: timeTicks(ts(VH[vhK[0][0]].d[0]), ts(VH[vhK[0][0]].as_of), 7),
      series: vhK.map(k => ({ name: VH[k[0]].label, ticker: k[2], color: css(k[1]), w: k[0] === "vn" ? 2.5 : 1.75, pts: pts(VH[k[0]]), endDot: true }))
    }, 280) + legend(vhK.map(k => ({ c: css(k[1]), tk: k[2], n: VH[k[0]].label }))) : panelMissing("Chưa có dữ liệu vận hành."),
    note: "Đường Việt Nam vẽ dày hơn vì là chuỗi tham chiếu của người đọc trang này, không phá bảng màu. " +
      "Ba chuỗi cùng đơn vị <span class=\"mono\">" + esc(uAll(vhK.map(k => VH[k[0]]))) + "</span> nên chung một trục."
  });

  /* =================== PHẦN 4 — VỊ THẾ VIỆT NAM =================== */
  h += partHd("Phần 4", "Vị thế Việt Nam — giá sợi so với các nguồn cung cạnh tranh",
    "Sợi Việt Nam đang đắt hay rẻ hơn sợi cùng loại của các nước xuất khẩu khác.");

  const usdK = [["vn_32s", "--series-1", "Việt Nam"], ["in_32s", "--series-3", "Ấn Độ"],
    ["pk_10s", "--series-4", "Pakistan"], ["uz_32s", "--series-6", "Uzbekistan"]].filter(k => has(G[k[0]]));
  const vnS = G.vn_32s;
  h += panel({
    span: "s12", title: "Giá sợi cotton — Việt Nam so với Ấn Độ · Pakistan · Uzbekistan", unit: uAll(usdK.map(k => G[k[0]])),
    cadence: cadence(FREQ.session, usdK.length ? dmy(G[usdK[0][0]].as_of) : "—", "ccf"),
    body: usdK.length ? chartBox({
      kind: "line", xkind: "time", yDec: 2, yUnit: U(G[usdK[0][0]]), ttDec: 2, endLabels: true, padR: 78, padL: 46,
      xTicks: timeTicks(ts(G[usdK[0][0]].d[0]), ts(G[usdK[0][0]].as_of), 7),
      series: usdK.map(k => ({
        name: G[k[0]].label, ticker: k[2], color: css(k[1]),
        w: k[0] === "vn_32s" ? 2.5 : 1.75, pts: pts(G[k[0]]), endDot: true
      }))
    }, 300) + legend(usdK.map(k => ({ c: css(k[1]), tk: k[2], n: G[k[0]].label })) ) : panelMissing("Chưa có dữ liệu giá sợi."),
    note: "Bốn chuỗi cùng đơn vị <span class=\"mono\">" + esc(uAll(usdK.map(k => G[k[0]]))) + "</span> nên chung một trục. " +
      "<b>Lưu ý khi so sánh:</b> chuỗi Pakistan là sợi <b>siro-spun 10s</b>, ba chuỗi còn lại là <b>32s</b> — khác chi số " +
      "thì khác mặt hàng, chênh lệch mức giá giữa Pakistan và nhóm 32s <b>không</b> đọc được thành lợi thế/bất lợi cạnh tranh. " +
      "Nhóm này để trung tính về màu: giá sợi cao có lợi cho đơn vị bán sợi nhưng bất lợi cho đơn vị mua sợi đi dệt. " +
      "Giá bông đầu vào của cùng khung thời gian nằm ở " + jump(1, 2, "sub-tab 2.3 Bông") + "."
  });

  const cn = G.cn_32s;
  h += panel({
    span: "s12", title: "Giá sợi cotton 32s Trung Quốc (nội địa)" + chip("đơn vị khác — KHÔNG quy đổi"),
    unit: U(cn),
    cadence: cadence(FREQ.session, has(cn) ? dmy(cn.as_of) : "—", "ccf"),
    body: has(cn) ? chartBox({
      kind: "line", xkind: "time", yDec: 0, yUnit: U(cn), ttDec: 0, padL: 58,
      xTicks: timeTicks(ts(cn.d[0]), ts(cn.as_of), 7),
      series: [{ name: cn.label, color: css("--series-2"), w: 1.75, pts: pts(cn), endDot: true }]
    }, 240) : panelMissing("Chưa có dữ liệu giá sợi Trung Quốc."),
    note: "<b>Vì sao tách khỏi biểu đồ trên:</b> đơn vị của chuỗi này là <span class=\"mono\">" + esc(U(cn)) +
      "</span>, khác hẳn <span class=\"mono\">" + esc(uAll(usdK.map(k => G[k[0]]))) + "</span> của bốn chuỗi kia. " +
      "Muốn đặt chung một trục thì phải quy đổi qua tỷ giá CNY/USD và hệ số khối lượng — trang này " +
      "<b>không tự chọn tỷ giá quy đổi</b>, vì con số quy đổi khi đó là số do trang tự đặt ra chứ không phải số quan sát được. " +
      "Đọc chuỗi này theo <b>chiều biến động</b> để cảm nhận mặt bằng giá sợi nội địa Trung Quốc, hoặc so bằng " +
      "mức chênh lệch tương đối giữa hai mốc thời gian, thay vì đặt hai mức tuyệt đối cạnh nhau."
  });

  /* Ghi chú gốc của doc (`phan4_vi_the_vn.note`) là ghi chú KỸ THUẬT cho người dựng dữ liệu —
     chứa tên trường JSON — nên KHÔNG in nguyên văn ra trang. Nội dung thực chất của nó
     (chỉ so sánh chéo giá; thiếu hẳn nhóm XNK hải quan Việt Nam) được viết lại bằng ngôn ngữ
     người đọc dưới đây; không được bỏ vế "chưa có dữ liệu hải quan VN". */
  h += '<div class="s12">' + xref("<b>Phạm vi phần 4 dừng ở đây.</b> Vị thế Việt Nam trong tab này chỉ được đo bằng " +
    "<b>so sánh chéo mức giá</b> giữa sợi Việt Nam và các nguồn cung cạnh tranh. Trang <b>không</b> hiển thị số liệu " +
    "xuất nhập khẩu hải quan Việt Nam — nhóm dữ liệu đó chưa có nguồn nào được duyệt cho mục này, và chỗ trống " +
    "được để lộ ra có chủ đích, không lấp bằng số suy đoán.") + "</div>";

  return h + "</div>";
}

function viewTygia() {
  const g = DATA.trends && DATA.trends.groups.tygia;
  if (!g) return noData("Tỷ giá");
  const u = g.fx["USD/VND"];
  let h = pageHd("Diễn biến thị trường · Tỷ giá", "Tỷ giá VND — 5 cặp tiền",
    "Tỷ giá đang cộng hay trừ vào giá vốn nhập khẩu và doanh thu xuất khẩu?",
    "<b>Khung hiển thị: 12 tháng gần nhất.</b> Nhóm này để <b>trung tính về màu</b>: doanh nghiệp vừa nhập nguyên liệu bằng USD vừa thu USD từ xuất khẩu — tô xanh/đỏ ở đây là nói sai bằng màu.");
  h += '<div class="grid">';
  const uAvgPts = u.d.map((d, i) => ({ x: ts(d), v: u.avg[i], label: dmy(d) }));
  const trUsd = trendSeries("USD/VND Bình quân", uAvgPts);
  h += panel({
    title: "USD/VND" + chip("đường chính = bình quân · dải = biên mua chuyển khoản–bán"), unit: "VND",
    cadence: cadence(FREQ.week, dmy(u.as_of), "vcb"),
    body: chartBox({
      kind: "line", xkind: "time", yDec: 0, yUnit: "VND", ttDec: 0, padL: 56,
      xTicks: timeTicks(ts(u.d[0]), ts(u.as_of), 7),
      areas: [{ fill: "rgba(74,143,224,.13)", lo: u.d.map((d, i) => ({ x: ts(d), v: u.buy[i] })), hi: u.d.map((d, i) => ({ x: ts(d), v: u.sell[i] })) }],
      series: (trUsd ? [trUsd] : []).concat([
        { name: "Bình quân", color: css("--series-1"), w: 2.5, pts: uAvgPts, marker: "dot", endDot: true },
        { name: "Mua chuyển khoản", color: "rgba(74,143,224,.5)", w: 1, pts: u.d.map((d, i) => ({ x: ts(d), v: u.buy[i], label: dmy(d) })) },
        { name: "Bán", color: "rgba(74,143,224,.5)", w: 1, pts: u.d.map((d, i) => ({ x: ts(d), v: u.sell[i], label: dmy(d) })) }
      ])
    }, 320) +
      legend([{ c: css("--series-1"), n: "Bình quân (đường chính)" },
        { c: "rgba(74,143,224,.35)", n: "dải = biên mua chuyển khoản–bán (dữ liệu thật trong nguồn, KHÔNG phải khoảng tin cậy)", bd: true }]
        .concat(trUsd ? [{ c: css("--ink3-panel"), n: "Xu hướng Bình quân (hồi quy tuyến tính, nét đứt)" }] : [])),
    note: esc(g.freq_note) + " Mọi quan sát thật đều có marker, không nội suy."
  });
  let cells = "";
  ["CNY/VND", "EUR/VND", "GBP/VND", "JPY/VND"].forEach(k => {
    const s = g.fx[k];
    const sPts = s.d.map((d, i) => ({ x: ts(d), v: s.avg[i], label: dmy(d) }));
    const trS = trendSeries(k + " Bình quân", sPts);
    cells += '<div class="sm-cell"><h4>' + esc(k) + " · bình quân</h4>" +
      '<p class="cadence">Gần nhất: <span class="mono">' + dmy(s.as_of) + "</span></p>" +
      chartBox({
        kind: "line", xkind: "time", yDec: 0, yUnit: "VND", ttDec: 0, padL: 46, padR: 10,
        xTicks: timeTicks(ts(s.d[0]), ts(s.as_of), 3),
        series: (trS ? [trS] : []).concat([{ name: k + " · bình quân", color: css("--series-1"), pts: sPts, w: 1.75, marker: "dot", endDot: true }])
      }, 150) + "</div>";
  });
  h += panel({
    title: "CNY · EUR · GBP · JPY / VND — đường bình quân", unit: "VND",
    cadence: cadence(FREQ.week, dmy(u.as_of), "vcb"),
    body: '<div class="sm sm-4">' + cells + "</div>",
    note: "Mỗi panel dùng thang VND riêng vì mức 4 cặp chênh nhau hàng chục lần — không chung trục, không dùng hai trục y. Biên mua chuyển khoản–bán chỉ hiển thị ở biểu đồ USD/VND phía trên. Mỗi panel cũng có đường xám nét đứt là <b>xu hướng hồi quy tuyến tính</b> trên khung 12 tháng hiển thị."
  });
  return h + "</div>";
}

      legend(cb.order.map((nm, i) => ({ c: css(COLORS[i]), tk: cb.series[nm].ticker, n: nm }))),
    note: "Phạm vi: <b>không bao gồm lãi suất điều hành của Ngân hàng Nhà nước Việt Nam</b>. <b>Minh bạch chênh lệch, không giấu:</b> " +
      esc(bok.note)
  });
  let rows = "";
  hd.rows.forEach(r => {
    rows += "<tr><td>" + esc(r.bank) + "</td>";
    r.v.forEach((v, i) => {
      rows += "<td>" + (v === null ? "—" : n2(v, 2)) +
        '<span class="ext">' + deltaHtml(r.delta[i], 2, "", "neutral") + "</span></td>";
    });
    rows += "</tr>";
  });
  h += panel({
    title: "Lãi suất huy động — 4 ngân hàng thương mại × 6 kỳ hạn" + chip("bảng so sánh tại 1 mốc"), unit: "%/năm",
    cadence: cadence(FREQ.bankrate, dmy(hd.as_of), "banks"),
    body: '<div class="table-wrap"><table><thead><tr><th>Ngân hàng</th>' +
      hd.tenors.map(t => "<th>" + t + " tháng<br><span style=\"font-weight:400;text-transform:none\">Δ so " + dmy(hd.baseline) + "</span></th>").join("") +
      "</tr></thead><tbody>" + rows + "</tbody></table></div>",
    note: "Bảng so sánh tại thời điểm gần nhất (<span class=\"mono\">" + dmy(hd.as_of) +
      "</span>), kèm chênh lệch so mốc <span class=\"mono\">" + dmy(hd.baseline) +

      esc((hd.src_note || []).join("; ")) + "."

}

<script>
"use strict";
/* =====================================================================
   11. MỤC 3 — DỰ BÁO & KHUYẾN NGHỊ (chỉ Bông)
   ===================================================================== */
/** Mốc tham chiếu để đếm ngược: mốc dữ liệu MỚI NHẤT đang hiển thị — KHÔNG Date.now() */
function refMark() {
  const f = DATA.forecast, g = DATA.trends && DATA.trends.groups;
  const marks = [DATA.bulletin && DATA.bulletin.research_date, f && f.cot && f.cot.as_of, f && f.data_as_of];
  if (g) [g.bong.ice_as_of, g.xo.series.px.as_of, g.tygia.fx["USD/VND"].as_of].forEach(x => marks.push(x));
  return marks.filter(Boolean).sort().pop();
}
/** §4.12 confidence-band — thành phần nổi bật nhất mục 3, hiển thị ở cả 4 sub-tab.
 *  KHÔNG sticky (bỏ theo phản hồi user 11/09/2026 — sticky che nội dung, khó nhìn khi cuộn).
 *  Nếu áp lại spec cũ có ghi "sticky", ĐỪNG tự thêm lại position:sticky ở .confidence-band. */
function confidenceBand() {
  const f = DATA.forecast;
  if (!f) return "";
  const ref = refMark(), left = daysBetween(ref, f.expiry_date), expired = left <= 0;
  const mae = f.backtest.map(b => b["Naive (RW)"]).filter(Boolean);
  const hzs = f.backtest.map(b => b.horizon);
  const evs = (f.events || []).filter(e => e.d === f.expiry_date);
  return '<section class="confidence-band on-panel">' +
    '<div class="cb-grid">' +
      '<div class="cb-zone"><span class="cb-big">Dải 90%</span>' +
      "<p>9 trên 10 khả năng giá nằm trong dải hiển thị. Bàn không công bố một con số dự báo điểm.</p></div>" +
      '<div class="cb-zone"><span class="cb-cap">Sai số đo được</span><div class="cb-nums">' +
        mae.map((m, i) => "<span><b>±" + n2(m.mae, 2) + "</b><i>" + hzs[i] + " phiên</i></span>").join("") +
      "</div><p>sai số tuyệt đối trung bình của phương pháp tham chiếu · cent/lb</p></div>" +
      '<div class="cb-zone"><span class="cb-cap">Hiệu lực</span>' +
      '<p>Tới <span class="mono">' + dmy(f.expiry_date) + "</span></p>" +
      '<span class="cb-count' + (expired ? " is-expired" : "") + '">' +
        (expired ? "Đã quá mốc làm mới" : "Còn " + left + " ngày") + "</span>" +
      (expired
        ? '<p class="cb-ev">Số đang hiển thị dựa trên dữ liệu trước mốc làm mới — cần chạy lại mô hình trước khi dùng để ra quyết định.</p>'
        : '<p class="cb-ev">Làm mới bởi: ' + (evs.length ? evs.map(e => esc(e.ten)).join(" · ") : "các mốc công bố trong kỳ") +
          '. Đếm ngược tính theo mốc dữ liệu mới nhất đang hiển thị (<span class="mono">' + dmy(ref) + "</span>), không theo đồng hồ máy người xem.</p>") +
      "</div>" +
    "</div>" +
    '<p class="cb-foot">Trên chuỗi này, mô hình ARIMA <b>không vượt được</b> phép so sánh “giá hôm nay giữ nguyên” ở cả 3 chân trời. ' +
    "Vì vậy bàn công bố <b>dải và đường cong kỳ hạn</b>, không công bố dự báo điểm. Chi tiết đo lường → " +
    jump(2, 1, "mục 3.2 Cơ sở &amp; độ tin cậy") + ".</p>" +
    '<p class="cb-disclaimer">Miễn trừ trách nhiệm: nội dung dự báo và khuyến nghị nêu trên chỉ mang tính chất tham khảo, ' +
    "được xây dựng trên dữ liệu và mô hình thống kê sẵn có tại thời điểm công bố; không cấu thành khuyến nghị đầu tư hay " +
    "cam kết về diễn biến giá trong tương lai. Quyết định giao dịch, mua sắm nguyên liệu của doanh nghiệp cần dựa trên " +
    "tình hình thực tế và kinh nghiệm chuyên môn của chính doanh nghiệp.</p></section>";
}

/* ---- 3.1 Hiện trạng & dải dự báo ---- */
function viewFc1() {
  const f = DATA.forecast;
  if (!f) return noData("Dự báo");
  const a = f.actual, hz = f.horizons, anc = f.anchor;
  const lastX = ts(a.d[a.d.length - 1]);
  let h = pageHd("Dự báo & khuyến nghị", "Hiện trạng & dải dự báo",
    "Giá bông có thể đi trong khoảng nào từ nay tới cuối tháng 9, và mốc nào làm nó lệch?",
    "<b>Khung hiển thị: 3 tháng lịch sử + chân trời dự báo tới " + dmy(hz[hz.length - 1].date) + ".</b>");
  h += confidenceBand();
  h += '<div class="grid">';
  h += panel({
    span: "s8", title: "Dải dự báo &amp; mốc sự kiện trong kỳ", unit: "cent/lb",
    cadence: cadence(FREQ.model, dmy(f.data_as_of), "deskEst"),
    body: chartBox({
      actual: a, horizons: hz, anchor: anc,
      events: f.events.map(e => Object.assign({}, e, { _hl: eventHighlight(e, f) })), notes: f.notes,

    }, 380, drawMilestone),
    note: "Mỗi hình thoi là một mốc công bố trong kỳ. Vạch dóng cho thấy mốc đó rơi vào đoạn nào của dải dự báo. " +
      "<b>Chữ vàng</b> cạnh mốc là nội dung chính đã diễn ra tại đúng mốc đó. " +
      "Ba mốc lớn — báo cáo cung–cầu, vị thế đầu cơ và quyết định lãi suất — cùng rơi trong khoảng 11–16/09, " +
      "đoạn bất định lớn nhất của chân trời, gắn với khuyến nghị Lớp 2 ở " + jump(2, 3, "mục 3.4") + ". " +
      "Màu hình thoi là <b>thang cường độ ảnh hưởng</b>, không phải thang tốt/xấu."
  });
  h += panel({
    span: "s4", title: "Bảng sự kiện",
    cadence: cadence(FREQ.model, dmy(f.data_as_of), "events"),
    body: '<div class="table-wrap"><table class="narrow"><thead><tr><th>Ngày</th><th style="text-align:left">Sự kiện</th><th>Mức ảnh hưởng</th></tr></thead><tbody>' +
      f.events.map((e, i) => '<tr class="ev-row' + (STATE.evSel === i ? " is-sel" : "") + '" data-ev="' + i + '" tabindex="0">' +
        "<td>" + dm(e.d) + '</td><td class="txt">' + esc(shortEvent(e.ten)) + "</td><td><span class=\"ms-pill " +
        msPill(e.muc_do) + '">' + esc(msOf(e.muc_do).label) + "</span></td></tr>").join("") +
      "</tbody></table></div>",
    note: "Bấm một dòng để làm nổi đúng hình thoi và vạch dóng tương ứng trên biểu đồ bên trái. Danh sách này và dòng thời gian ở " +
      jump(2, 3, "mục 3.4") + " luôn cùng số dòng, cùng thứ tự."
  });
  // thẻ neo + bảng dải theo hàng ngang (cân đối) + thẻ giải thích bắt buộc
  h += '<div class="s12" style="display:flex;gap:16px;align-items:stretch;flex-wrap:wrap">' +
    '<div class="panel on-panel" style="flex:0 0 260px"><div class="tile"><span class="tile-label">Neo hiệu chỉnh · cơ sở của dải</span>' +
    '<span class="tile-value">' + n2(anc.value, 2) + '<span class="tile-unit">cent/lb</span></span>' +
    '<span class="delta is-neutral"><span>■</span> quan sát thô ' + n2(anc.raw_observed, 2) + " · " + dmy(anc.raw_observed_date) + "</span>" +
    '<span class="tile-note">giá trị ước tính, không phải số công bố</span></div>' +
    cadence(FREQ.model, dmy(f.data_as_of), "deskEst") + "</div>" +
    '<div style="flex:1 1 360px">' + panel({
      span: "", title: "Dải 90% theo 3 chân trời", unit: "cent/lb",
      cadence: cadence(FREQ.model, dmy(f.data_as_of), "deskEst"),
      body: '<div class="table-wrap"><table class="narrow"><thead><tr><th>Chân trời</th><th>Low90</th><th>Center</th><th>High90</th></tr></thead><tbody>' +
        hz.map(x => "<tr><td>" + x.horizon + " phiên · " + dm(x.date) + "</td><td>" + n2(x.low90, 2) +
          "</td><td>" + n2(x.center, 2) + "</td><td>" + n2(x.high90, 2) + "</td></tr>").join("") +
        "</tbody></table></div>",
      note: "Dải bất định để <b>trung tính về màu</b>: rộng hay hẹp đều không phải tin tốt hay tin xấu."
    }) + "</div></div>";
  h += '<div class="s12">' + xref("<b>Vì sao dùng " + n2(anc.value, 2) + " chứ không phải " + n2(anc.raw_observed, 2) + "?</b> " +
    esc(anc.why) + " Trang chỉ đặt hai con số này cạnh nhau <b>khi có thẻ giải thích này</b>. Chuỗi quan sát thô đầy đủ nằm ở " +
    jump(1, 2, "mục 2.3 Bông") + ".") + "</div>";
  // supporting: fan chart bối cảnh
  const cutAll = STATE.fcAll, x0 = cutAll ? ts(a.cut_from) : lastX - 184 * 86400000;
  const lo = [{ x: lastX, v: anc.value }].concat(hz.map(x => ({ x: ts(x.date), v: x.low90 })));
  const hi = [{ x: lastX, v: anc.value }].concat(hz.map(x => ({ x: ts(x.date), v: x.high90 })));
  const ct = [{ x: lastX, v: anc.value, label: "Neo hiệu chỉnh " + dmy(f.data_as_of) }]
    .concat(hz.map(x => ({ x: ts(x.date), v: x.center, label: dmy(x.date) + " · " + x.horizon + " phiên", note: f.notes[String(x.horizon)] })));
  h += panel({
    span: "s12", title: "Bối cảnh dài hơn — Cotlook A Index quan sát &amp; dải dự báo", unit: "cent/lb",
    hdExtra: '<span class="toggle"><button data-fc="0" class="' + (cutAll ? "" : "is-active") + '">6 tháng</button>' +
      '<button data-fc="1" class="' + (cutAll ? "is-active" : "") + '">toàn chuỗi</button></span>',
    cadence: cadence(FREQ.model, dmy(a.as_of), "deskEst"),
    body: chartBox({
      kind: "line", xkind: "time", yDec: 0, yUnit: "cent/lb", padR: 20,
      x0: x0, x1: ts(hz[hz.length - 1].date) + 2 * 86400000,
      xTicks: timeTicks(x0, ts(hz[hz.length - 1].date), 6),
      areas: [{ lo: lo, hi: hi, fill: css("--fc-band"), hatch: true }],
      vlines: [{ x: lastX, color: css("--rule-panel"), dash: true, label: "DỰ BÁO (ƯỚC TÍNH)" }],
      series: [
        { name: "Cotlook A Index (quan sát)", color: css("--series-2"), w: 1.75, pts: pts(a), endDot: true },
        { name: "Center (ước tính)", color: css("--fc-center"), w: 1.75, dash: true, pts: ct },
        { name: "High90", color: "rgba(134,182,239,.5)", w: 1, pts: hi },
        { name: "Low90", color: "rgba(134,182,239,.5)", w: 1, pts: lo }
      ]
    }, 220) +
      legend([{ c: css("--series-2"), n: "Cotlook A Index — quan sát thật" },
        { c: css("--fc-center"), n: "Center (nét đứt) — giá trị ước tính" },
        { c: "rgba(74,143,224,.3)", n: "dải 90%, phủ gạch chéo = vùng dự báo", bd: true }]),
    note: "Trục lịch sử bắt đầu từ " + dmy(a.cut_from) + " — thời điểm chuỗi chuyển sang tần suất theo phiên. " +
      "Biểu đồ này vẽ cùng một dải với biểu đồ mốc sự kiện ở trên nhưng <b>khác khung thời gian</b> (trục theo tháng, không có làn hình thoi) — không phải lặp."
  });
  return h + "</div>";
}

/* ---- 3.2 Cơ sở & độ tin cậy ---- */
function viewFc2() {
  const f = DATA.forecast;
  if (!f) return noData("Dự báo");
  const cv = f.curve, ICEC = { Oct26: "--ice-1", Dec26: "--ice-2", Mar27: "--ice-3", May27: "--ice-4" };
  let h = pageHd("Dự báo & khuyến nghị", "Cơ sở & độ tin cậy",
    "Dựa vào đâu mà tin dải này, và nó sai được bao nhiêu?");
  h += confidenceBand();
  h += '<div class="grid">';
  const first = cv.points[0], last = cv.points[cv.points.length - 1];
  h += panel({
    span: "s12", title: "Đường cong kỳ hạn ICE tại " + dmy(cv.date) + chip("ảnh chụp 1 ngày, không phải chuỗi theo thời gian"), unit: cv.unit,
    cadence: cadence(FREQ.model, dmy(cv.date), "ice"),
    body: chartBox({
      kind: "bar", xkind: "band", yDec: 0, yUnit: "cent/lb", padT: 26,
      xTicks: cv.points.map((p, i) => ({ x: i, label: p.key })),
      series: [{ name: "Đường cong kỳ hạn", color: css("--ice-2"), pts: cv.points.map((p, i) => ({ x: i, v: p.v, label: p.contract, color: css(ICEC[p.key]) })) }]
    }, 280),
    note: "<b>" + n2(first.v, 2) + " → " + n2(last.v, 2) +
      " cent/lb</b> — thị trường đang định giá kỳ hạn xa cao hơn kỳ hạn gần (contango). Đây là dự báo của chính thị trường kỳ hạn, không phải mô hình thống kê nội bộ."
  });
  let rows = "";
  f.backtest.forEach(b => {
    const nv = b["Naive (RW)"], ar = b["ARIMA(1,1,1)"];
    const worse = ar && nv && ar.mae > nv.mae;
    rows += "<tr><td>" + b.horizon + " phiên</td><td>" + n2(nv.mae, 3) + "</td><td>" + n2(nv.rmse, 3) + "</td><td>" +
      n2(ar.mae, 3) + (worse ? '<span class="ext"><span class="delta is-bad"><span>▲</span> <i>kém hơn</i></span></span>' : "") +
      "</td><td>" + n2(ar.rmse, 3) + "</td><td>" + nInt(b.n) + "</td></tr>";
  });
  h += panel({
    span: "s8", title: "Backtest walk-forward — giữ nguyên giá (naive) vs ARIMA(1,1,1)", unit: "MAE / RMSE · cent/lb",
    cadence: cadence(FREQ.model, dmy(f.data_as_of), "deskMeas"),
    body: '<div class="table-wrap"><table><thead><tr><th>Chân trời</th><th>Naive · MAE</th><th>Naive · RMSE</th>' +
      "<th>ARIMA · MAE</th><th>ARIMA · RMSE</th><th>Số điểm</th></tr></thead><tbody>" + rows + "</tbody></table></div>" +
      '<div class="verdict">ARIMA(1,1,1) thua phép so sánh giữ nguyên giá ở cả 3 chân trời → bàn không công bố dự báo điểm.</div>',
    note: "Bảng, không phải biểu đồ — 3 chân trời là quá ít điểm để vẽ. Sai số để <b>trung tính về màu</b>; chỉ ô ARIMA thua naive được đánh dấu."
  });
  h += panel({
    span: "s4", title: "Vì sao dùng dải + đường cong kỳ hạn, không dùng dự báo điểm",
    cadence: cadence(FREQ.model, dmy(f.data_as_of), "deskEst"),
    body: '<div class="news-body" style="font-size:13.5px;margin-top:0">Giá bông gần <b>bước ngẫu nhiên</b>: mô hình chuỗi thời gian không đánh bại được chính mức giá hiện tại, và bảng backtest bên cạnh là bằng chứng đo được của điều đó — không phải nhận định.<br><br>Vì vậy trang trình bày hai thứ trung thực hơn một con số: (1) <b>dải 90%</b> mô tả biên độ biến động có thể xảy ra; (2) <b>đường cong kỳ hạn ICE</b> — mức giá mà chính thị trường đang sẵn sàng giao dịch cho từng kỳ hạn.<br><br>Mọi vùng ước tính trên trang đều được phủ gạch chéo và vẽ nét đứt để không bị đọc nhầm thành quan sát.</div>'
  });
  return h + "</div>";
}

/* ---- 3.3 Vị thế & cung–cầu ---- */
function viewFc3() {
  const f = DATA.forecast;
  if (!f) return noData("Dự báo");
  const c = f.cot, z = c.z_last, thr = c.z_threshold;
  const ZMIN = -3, ZMAX = 3;
  const pct = (v) => ((Math.max(ZMIN, Math.min(ZMAX, v)) - ZMIN) / (ZMAX - ZMIN) * 100);
  let h = pageHd("Dự báo & khuyến nghị", "Vị thế & cung–cầu",
    "Dòng tiền đầu cơ và cán cân cung–cầu đang nghiêng về đâu?");
  h += confidenceBand();
  h += '<div class="grid">';
  const zi = c.z.map((v, i) => ({ v: v, i: i })).filter(x => x.v !== null);
  const sparkFrom = zi.length ? zi[0].i : 0;
  h += panel({
    span: "s12", title: "Vị thế mua ròng của quỹ đầu cơ — điểm z" + chip("thanh ngưỡng, không phải line chart"), unit: "điểm z",
    cadence: cadence(FREQ.cot, dmy(c.as_of), "cotZ"),
    body: '<div class="gauge-scale"><span>−3</span><span>−1,8</span><span>0</span><span>+1,8</span><span>+3</span></div>' +
      '<div class="gauge"><div class="viol" style="left:' + pct(thr) + '%;right:0"></div>' +
      '<div class="thr" style="left:' + pct(thr) + '%"></div></div>' +
      '<div class="gauge-needle"><div class="n" style="left:' + pct(z) + '%">' +
      '<div class="tri">▲</div><div class="v">' + n2(z, 2) + "</div></div></div>" +
      '<div class="gauge-note"><span class="mono">!</span><span>z = ' + n2(z, 2) + " > " + n2(thr, 1) +
      " — vị thế mua đầu cơ đang cực đoan → hoãn Lớp 3. Xem trạng thái <b>Đạt ngưỡng</b> ở bảng cảnh báo giảm sâu tại " +
      jump(2, 3, "mục 3.4") + ".</span></div>" +
      '<div style="margin-top:14px">' + chartBox({
        kind: "line", xkind: "time", yDec: 1, yUnit: "điểm z", padL: 34, padT: 8, padB: 20,
        xTicks: timeTicks(ts(c.d[sparkFrom]), ts(c.as_of), 5),
        series: [
          { name: "điểm z vị thế mua ròng", color: css("--series-1"), w: 1.5, endDot: true, pts: c.d.slice(sparkFrom).map((d, i) => ({ x: ts(d), v: c.z[sparkFrom + i], label: dmy(d) })) },
          { name: "ngưỡng 1,8", color: css("--bad-panel"), w: 1, dash: true, pts: [{ x: ts(c.d[sparkFrom]), v: thr, label: "ngưỡng" }, { x: ts(c.as_of), v: thr, label: "ngưỡng" }] }
        ]
      }, 90) + "</div>",
    note: "Đường phụ là bối cảnh lịch sử của điểm z, nét đứt đỏ là ngưỡng 1,8. <b>Điểm z là số dẫn xuất</b> — chuỗi gốc do CFTC công bố, phép chuẩn hoá là ước tính của bàn. Vị thế mua đầu cơ dày lên là <b>rủi ro giá lên</b> với người mua bông."
  });
  h += panel({
    span: "s6", title: "Vị thế mua ròng &amp; tổng vị thế mở", unit: "hợp đồng",
    cadence: cadence(FREQ.cot, dmy(c.as_of), "cftc"),
    body: chartBox({
      kind: "line", xkind: "time", yDec: 0, yUnit: "hợp đồng", ttDec: 0, padL: 60,
      xTicks: timeTicks(ts(c.d[0]), ts(c.as_of), 6),
      series: [
        { name: "Tổng vị thế mở", color: css("--series-3"), w: 1.5, pts: c.d.map((d, i) => ({ x: ts(d), v: c.oi[i], label: dmy(d) })), endDot: true },
        { name: "Vị thế mua ròng của quỹ đầu cơ", color: css("--series-1"), w: 1.75, pts: c.d.map((d, i) => ({ x: ts(d), v: c.mm_net[i], label: dmy(d) })), endDot: true }
      ],
      annos: (c.mm_net.length ? [{
        x: ts(c.d[c.d.length - 1]), v: c.mm_net[c.mm_net.length - 1],
        text: "MM net long " + nInt(c.mm_net[c.mm_net.length - 1]) + " hợp đồng|z-score " + n2(z, 2) + " (>ngưỡng " + n2(thr, 1) + ")",
        color: css("--anchor"), dx: -130, dy: -30
      }] : [])
    }, 260) +
      legend([{ c: css("--series-3"), n: "Tổng vị thế mở" }, { c: css("--series-1"), n: "Vị thế mua ròng của quỹ đầu cơ" }]),
    note: "Chuỗi dài nhất toàn trang — " + c.n + " tuần từ " + dmy(c.d[0]) + ". <b>Chữ vàng</b> là nội dung chính của mốc CFTC CoT mới nhất."
  });
  const w = f.wasde.rows, yrs = [];
  w.forEach((r, i) => { if (i === 0 || r.my !== w[i - 1].my) yrs.push({ x: ts(r.d), color: css("--rule-panel"), dash: true, label: r.my }); });
  const bw = DATA.bulletin && (DATA.bulletin.items || []).find(x => x.id === "wasde");
  const worldSU = bw && bw.figures && bw.figures[0] ? bw.figures[0].value : null;
  h += panel({
    span: "s6", title: "WASDE Stocks-to-Use" + chip("phạm vi: MỸ"), unit: "%",
    cadence: cadence(FREQ.month, myShort(f.wasde.as_of) + " · niên vụ " + w[w.length - 1].my, "wasde"),
    body: chartBox({
      kind: "line", xkind: "time", yDec: 0, yUnit: "%", padL: 38, srcKey: "wasde",
      xTicks: timeTicks(ts(w[0].d), ts(f.wasde.as_of), 6),
      vlines: yrs,
      series: [{ name: "Stocks-to-Use (Mỹ)", color: css("--series-1"), w: 1.75, endDot: true, pts: w.map(r => ({ x: ts(r.d), v: r.su, label: myShort(r.d) + " · niên vụ " + r.my, src: r.src })) }],
      annos: (w.length >= 2 ? [{
        x: ts(w[w.length - 1].d), v: w[w.length - 1].su,
        text: "S/U Mỹ " + n2(w[w.length - 2].su, 2) + "%→" + n2(w[w.length - 1].su, 2) + "%|niên vụ " + w[w.length - 1].my,
        color: css("--anchor"), dx: -130, dy: -28
      }] : [])
    }, 260) +
      xref("<b>Cảnh báo tránh nhầm số:</b> thẻ tin ở " + jump(0, 1, "mục 1") + " nêu <b>S/U thế giới" +
        (worldSU ? " " + esc(worldSU) + "%" : "") + "</b>, còn biểu đồ này là <b>S/U của Mỹ (" + n2(w[w.length - 1].su, 2) +
        "%)</b>. Hai con số khác phạm vi địa lý — không đọc thành “S/U vừa giảm từ mức thế giới xuống mức Mỹ”."),
    note: "Vạch dọc là mốc chuyển niên vụ. Hover mỗi điểm để mở đúng bản báo cáo USDA của tháng đó. " +
      "Tồn kho dồi dào lên là <b>cung nới</b> — có lợi cho người mua bông; đây là chiều <b>ngược trực giác</b> so với các chỉ tiêu giá. <b>Chữ vàng</b> là nội dung chính của báo cáo WASDE mới nhất."
  });
  return h + "</div>";
}

/* ---- 3.4 Khuyến nghị mua & lịch sự kiện ---- */
function layerStatus3(thoiDiem, refTs, year) {
  const m = /(\d{1,2})-(\d{1,2})\/(\d{1,2})/.exec(String(thoiDiem || ""));
  if (!m) return ["is-armed", "◷", "CHỜ ĐIỀU KIỆN", "neutral"];
  const mo = +m[3] - 1, start = Date.UTC(year, mo, +m[1]), end = Date.UTC(year, mo, +m[2], 23, 59, 59);
  if (refTs < start) return ["is-armed", "◷", "CHƯA TỚI", "neutral"];
  if (refTs <= end) return ["is-open", "●", "ĐANG MỞ", "good"];
  return ["is-past", "○", "CỬA SỔ ĐÃ ĐÓNG", "neutral"];
}
function viewFc4() {
  const f = DATA.forecast;
  if (!f) return noData("Dự báo");
  const rec = f.rec, layers = rec.filter(r => r.nhom === "Phân lớp mua");
  const refTs3 = ts(refMark()), yr3 = new Date(ts(f.data_as_of)).getUTCFullYear();
  const ST3 = {};
  layers.forEach(r => { ST3[r.ten] = layerStatus3(r.thoi_diem, refTs3, yr3); });
  let h = pageHd("Dự báo & khuyến nghị", "Khuyến nghị mua & lịch sự kiện",
    "Mua bao nhiêu, khi nào, và mốc nào phải xem lại?");
  h += confidenceBand();
  h += "<div>";
  h += '<div class="rec-rail">' + layers.map((r, i) => {
    const st = ST3[r.ten] || ["", "", "", ""];
    return (i ? '<span class="line"></span>' : "") + '<span class="dot ' + (st[0] === "is-open" ? "is-open" : "") + '"></span>';
  }).join("") + '<span class="line"></span></div>';
  h += '<div class="recs">' + layers.map(r => {
    const st = ST3[r.ten] || ["", "○", "", "neutral"];
    return '<article class="rec-card on-panel ' + st[0] + '"><header class="rc-hd">' +
      '<span class="rc-step">' + esc(String(r.ten).toUpperCase()) + "</span>" +
      '<span class="pill ' + st[3] + '"><span>' + st[1] + "</span> " + st[2] + "</span></header>" +
      '<div class="rc-weight">' + n2(r.min, 0) + "–" + n2(r.max, 0) + '<span class="unit">' + esc(r.don_vi) + "</span></div>" +
      '<div class="rc-when">' + esc(r.thoi_diem) + "</div>" +
      '<p class="rc-why">' + esc(r.y_nghia) + "</p>" +
      (st[0] === "is-past" ? '<p class="rc-note">Hạn cuối ' + esc(r.thoi_diem) + " — cửa sổ này không còn nguyên phía trước.</p>" : "") +
      '<div class="rc-ft">' + cadence(FREQ.model, dmy(f.data_as_of), "deskRec") + "</div></article>";
  }).join("") + "</div>";

  const g = DATA.trends && DATA.trends.groups.bong, cot = f.cot;
  const lastDec = g ? g.ice.dec26.v[g.ice.dec26.v.length - 1] : null;
  const lastCotlook = g ? g.cotlook.v[g.cotlook.v.length - 1] : null;
  const anc = f.anchor || {};
  const hasAnchor = anc.value !== null && anc.value !== undefined;
  const cotlookRef = hasAnchor ? anc.value : lastCotlook;
  function statusOf(r, whenMet) {
    const nm = r.ten, op = r.dieu_kien;
    let cur = null, lbl = "";
    if (/Cotlook/i.test(nm)) {
      if (!g && !hasAnchor) return { na: true };
      cur = cotlookRef;
      lbl = hasAnchor ? "Neo hiệu chỉnh " + n2(cur, 2) + " · " + dmy(f.data_as_of)
                      : "Cotlook (thô) " + n2(cur, 2) + " · " + dmy(g.cotlook.as_of);
    } else if (/Dec26/i.test(nm)) {
      if (!g) return { na: true };
      cur = lastDec; lbl = "ICE Dec26 " + n2(cur, 2) + " · " + dmy(g.ice.dec26.as_of);
    } else if (/CoT z/i.test(nm)) {
      cur = cot.z_last; lbl = "điểm z = " + n2(cur, 2) + " · " + dmy(cot.as_of);
    } else return { na: true };
    const thr = (op === "≤" || op === "<") ? r.max : r.min;
    const met = op === "≤" ? cur <= thr : op === "<" ? cur < thr : op === ">" ? cur > thr : false;
    return { na: false, met: met, cur: lbl, thr: thr };
  }
  function thrTable(nhom, title, whenMet, asOfText, extraNote) {
    const rows = rec.filter(r => r.nhom === nhom);
    let body = '<div class="table-wrap"><table><thead><tr><th>Chỉ tiêu</th><th>Điều kiện</th><th>Ngưỡng</th>' +
      "<th>Giá trị hiện tại</th><th>Ý nghĩa</th><th>Trạng thái</th></tr></thead><tbody>";
    rows.forEach(r => {
      const st = statusOf(r, whenMet);
      const thr = (r.dieu_kien === "≤" || r.dieu_kien === "<") ? r.max : r.min;
      const pill = st.na
        ? '<span class="pill na"><span>—</span> Không đối chiếu được</span>'
        : (st.met ? '<span class="pill ' + whenMet + '"><span>✓</span> Đạt ngưỡng</span>'
                  : '<span class="pill neutral"><span>○</span> Chưa đạt</span>');
      body += "<tr><td>" + esc(r.ten) + "</td><td>" + esc(r.dieu_kien) + "</td><td>" + n2(thr, 2) + " " + esc(r.don_vi || "") +
        "</td><td>" + (st.na ? "—" : esc(st.cur)) + '</td><td class="txt">' + esc(r.y_nghia) +
        (st.na ? " <b>Bàn không tự tính chỉ số này — không có chuỗi số tương ứng trong nguồn.</b>" : "") +
        (/CoT z/i.test(r.ten) ? " " + jump(2, 2, "Xem thanh ngưỡng tại mục 3.3") + "." : "") +
        "</td><td>" + pill + "</td></tr>";
    });
    body += "</tbody></table></div>";
    return panel({
      span: "s12", title: title,
      cadence: cadence(FREQ.model, asOfText, "deskRec"),
      body: body,
      note: (hasAnchor && rows.some(r => /Cotlook/i.test(r.ten))
        ? '<b>Căn cứ giá hiện hành cho ngưỡng Cotlook:</b> neo hiệu chỉnh <span class="mono">' + n2(anc.value, 2) +
          "</span> cent/lb (tính trên dữ liệu đến " + dmy(f.data_as_of) + '), KHÔNG dùng quan sát thô <span class="mono">' +
          n2(anc.raw_observed, 2) + "</span> cent/lb ngày " + dmy(anc.raw_observed_date) +
          " — đúng nguyên tắc ghi ở khối <b>Nguyên tắc KHÔNG làm</b> bên dưới. Với cả hai số, kết luận ngưỡng không đổi. " +
          jump(2, 0, "Cơ sở của neo tại mục 3.1") + ". " : "") +
        "Cùng chữ “Đạt ngưỡng” nhưng màu khác nhau giữa 3 bảng, vì ba bảng mang ý nghĩa ngược nhau — màu mã hoá <b>hệ quả thị trường cho người mua</b>, không mã hoá hành động nên làm. " +
        (extraNote || "")
    });
  }
  h += '<div class="grid" style="margin-top:18px">';
  h += thrTable("Ngưỡng mua (kích hoạt Lớp 3)", "Ngưỡng mua — kích hoạt Lớp 3", "good",
    "ICE " + dmy(g ? g.ice.dec26.as_of : null) + (hasAnchor ? " · neo hiệu chỉnh " + dmy(f.data_as_of) : ""),
    "Ở bảng này, “Đạt ngưỡng” nghĩa là giá đã về vùng mua tốt.");
  h += thrTable("Ngưỡng cảnh báo giảm sâu (tạm dừng)", "Ngưỡng cảnh báo giảm sâu — tạm dừng", "bad",
    "ICE " + dmy(g ? g.ice.dec26.as_of : null) + " · vị thế đầu cơ " + dmy(cot.as_of),
    "Ở bảng này, “Đạt ngưỡng” nghĩa là điều kiện cảnh báo đã kích hoạt.");
  h += thrTable("Ngưỡng xác nhận tăng trở lại (đẩy nhanh)", "Ngưỡng xác nhận tăng trở lại — đẩy nhanh", "bad",
    dmy(f.data_as_of),
    "Ở bảng này, “Đạt ngưỡng” nghĩa là thị trường xác nhận đi lên → chi phí mua tăng, dù hành động đi kèm là đẩy nhanh mua.");
  const rules = rec.filter(r => r.nhom === "Nguyên tắc KHÔNG làm");
  h += '<div class="s12"><div class="rule-card on-panel"><h3>Nguyên tắc không làm</h3>' +
    rules.map(r => '<div class="r"><span class="g">⊘</span><span><b>' + esc(r.ten) + "</b> — " +
      (r.min !== null ? "ngưỡng " + n2(r.min, 0) + " " + esc(r.don_vi || "") + ", " : "") +
      esc(r.thoi_diem) + ". " + esc(r.y_nghia) + "</span></div>").join("") + "</div></div>";
  h += panel({
    span: "s12", title: "Lịch sự kiện — " + f.events.length + " mốc" + chip("chỉ sự kiện có ngày + nguồn xác thực"),
    cadence: cadence(FREQ.model, dmy(f.data_as_of), "events"),
    body: '<ul class="timeline">' + f.events.map((e, i) =>
      '<li class="ev-row' + (e.d === f.expiry_date ? " is-refresh" : "") + (STATE.evSel === i ? " is-sel" : "") +
      '" data-ev="' + i + '" data-jump="1" tabindex="0">' +
      '<span class="tl-diamond ' + msClass(e.muc_do) + '"></span>' +
      '<span class="tl-date">' + dmy(e.d) + "</span>" +
      '<span><span class="tl-name">' + esc(e.ten) + '</span><span class="tl-kind"> · ' + esc(e.loai) + "</span>" +
      (eventHighlight(e, f) ? '<p class="tl-hl">' + esc(eventHighlight(e, f)) + "</p>" : "") +
      '<p class="tl-desc">' + esc(e.mo_ta) + "</p></span>" +
      '<span class="ms-pill ' + msPill(e.muc_do) + '">' + esc(msOf(e.muc_do).label) + "</span>" +
      '<span class="tl-src">' + srcLink(SRC_BY_DOMAIN[e.nguon] || "events") + "</span></li>").join("") + "</ul>",
    note: "Marker hình thoi để khớp thị giác với biểu đồ mốc sự kiện ở " + jump(2, 0, "mục 3.1") +
      " — bấm một mốc ở đây sẽ nhảy sang đó và làm nổi đúng hình thoi. Màu ramp một sắc thể hiện <b>mức ảnh hưởng tới dải dự báo</b>, không thể hiện tin tốt hay tin xấu. <b>Chữ vàng</b> là nội dung chính đã diễn ra tại mốc đó."
  });
  return h + "</div></div>";
}
</script>

<script>
"use strict";
/* =====================================================================
   12. SNAPSHOT BAR · MENU · RIBBON (§4.1–4.3)
   ===================================================================== */
const COLL = "bong-xo-vphdqt";
let DB = null, BUSY = false, DONE_AT = "";

function snapList() {
  const ix = DATA.index;
  const arr = (ix && Array.isArray(ix.snapshots) ? ix.snapshots.slice() : []);
  arr.sort((a, b) => String(b.date).localeCompare(String(a.date)));
  return arr;
}
function runDate() {
  if (STATE.snap) return STATE.snap;
  const t = DATA.trends && DATA.trends.generated_at;
  return t ? String(t).slice(0, 10) : null;
}
function renderSnapBar() {
  const hist = !!STATE.snap, list = snapList();
  const el = document.getElementById("sbSnap");
  let h = '<span class="sb-label" title="Ngày chạy cập nhật. Ngày của từng số liệu nằm ở dòng nhịp trong mỗi biểu đồ và lệch nhau tuỳ nguồn.">Cập nhật lần cuối</span>' +
    '<span class="sb-date mono">' + dmy(runDate()) + "</span>" +
    '<button class="sb-pick' + (hist ? " is-history" : "") + '" id="sbPick" aria-haspopup="listbox" aria-expanded="' + STATE.menu + '">' +
    (hist ? "◷ Bản lưu " + dmy(STATE.snap) : "Xem lại thời điểm khác") + ' <span class="chev">▾</span></button>';
  if (!hist) h += '<button class="sb-refresh" id="sbRefresh" title="Tải lại dữ liệu mới nhất" aria-label="Tải lại dữ liệu mới nhất"' +
    (BUSY ? ' aria-busy="true"' : "") + '><span class="g">' + (BUSY ? "…" : "⟳") + "</span></button>";
  if (DONE_AT) h += '<span class="sb-done">Đã tải lại · <span class="mono">' + esc(DONE_AT) + "</span></span>";
  if (STATE.menu) {
    h += '<div class="snapshot-menu on-paper" role="listbox" id="snapMenu"><div class="sm-hd">Các lần cập nhật đã lưu</div>';
    if (!list.length) h += '<div class="sm-empty">Chưa có bản lưu nào trước đó.</div>';
    else list.forEach((s, i) => {
      const isCur = (STATE.snap === null && i === 0) || STATE.snap === s.date;
      h += '<button role="option" aria-selected="' + isCur + '" class="sm-row" data-snap="' + esc(s.date) + '">' +
        '<span class="sm-date">' + (i === 0 ? '<span class="sm-dot"></span>' : "") + dmy(s.date) + "</span>" +
        '<span class="sm-tag">' + (i === 0 ? "Mới nhất" : "") + (i === 0 && s.label ? " · " : "") + esc(s.label || "") + "</span>" +
        "<span>" + (isCur ? "✓" : "") + "</span></button>";
    });
    h += "</div>";
  }
  el.innerHTML = h;
  const rib = document.getElementById("ribbonSlot");
  rib.innerHTML = hist
    ? '<div class="history-ribbon on-panel" role="status"><span class="hr-glyph">◷</span>' +
      '<p>Đang xem bản lưu ngày <span class="mono">' + dmy(STATE.snap) +
      "</span> — dữ liệu và khuyến nghị dưới đây là trạng thái tại thời điểm đó.</p>" +
      '<button class="hr-back" id="hrBack">Quay lại bản mới nhất</button></div>'
    : "";
  syncTopbar();
}
function syncTopbar() {
  const tb = document.getElementById("topbar");
  if (tb) document.documentElement.style.setProperty("--h-topbar", tb.offsetHeight + "px");
}
if (window.ResizeObserver) new ResizeObserver(syncTopbar).observe(document.getElementById("topbar"));
addEventListener("resize", syncTopbar);

/* =====================================================================
   13. ĐIỀU HƯỚNG & RENDER
   ===================================================================== */
const VIEWS = [
  [viewBulletin, viewBulletin, viewBulletin],
  /* thứ tự PHẢI khớp SECTIONS[1].tabs — Sợi đứng ngay sau Xơ (index 4), Tỷ giá/Lãi suất lùi xuống 5/6.
     Mọi jump(1, N)/go(1, N) trong file phải dùng index MỚI này. */
  [viewVimo, viewLogistics, viewBong, viewXo, viewSoi, viewTygia, viewLaisuat],
  [viewFc1, viewFc2, viewFc3, viewFc4]
];
function renderNav() {
  document.getElementById("navList").innerHTML = SECTIONS.map((s, i) =>
    '<button class="' + (i === STATE.sec ? "is-active" : "") + '" role="tab" aria-selected="' + (i === STATE.sec) +
    '" data-sec="' + i + '"><span class="n">' + s.n + "</span> " + esc(s.name) + "</button>").join("");
  document.getElementById("subtabs").innerHTML = SECTIONS[STATE.sec].tabs.map((t, i) =>
    '<button class="' + (i === STATE.tab ? "is-active" : "") + '" role="tab" aria-selected="' + (i === STATE.tab) +
    '" data-tab="' + i + '">' + esc(t) + "</button>").join("");
}
function sideFoot() {
  const g = DATA.trends && DATA.trends.groups, f = DATA.forecast;
  if (!g) return "";
  return "Số liệu tới ngày, theo nhóm:" +
    '<span class="mono">Xơ ' + dmy(g.xo.series.px.as_of) + " · Tỷ giá " + dmy(g.tygia.fx["USD/VND"].as_of) + "</span>" +
    '<span class="mono">Bông ' + dmy(g.bong.ice_as_of) + (f ? " · Vị thế " + dmy(f.cot.as_of) : "") + "</span>" +
    '<span class="mono">Lãi suất ' + dmy(g.laisuat.cb.series[g.laisuat.cb.order[0]].as_of) + "</span>" +
    (DATA.soi && DATA.soi.phan1_bien_keo_soi && DATA.soi.phan1_bien_keo_soi.gia_soi &&
      DATA.soi.phan1_bien_keo_soi.gia_soi.vn_32s
      ? '<span class="mono">Sợi ' + dmy(DATA.soi.phan1_bien_keo_soi.gia_soi.vn_32s.as_of) + "</span>" : "");
}
function render() {
  renderNav(); renderSnapBar();
  CHARTS.length = 0;
  document.getElementById("wrap").innerHTML = VIEWS[STATE.sec][STATE.tab]();
  document.getElementById("navFoot").innerHTML = sideFoot();
  paintCharts(); syncTopbar();
  if (STATE.sec === 0) {
    const b = DATA.bulletin;
    if (b && b.items[STATE.tab] && STATE.tab > 0) {
      const el = document.getElementById("news-" + b.items[STATE.tab].id);
      if (el) el.scrollIntoView({ behavior: "auto", block: "start" });
    }
  } else scrollTo(0, 0);
}
function go(sec, tab) { STATE.sec = sec; STATE.tab = tab; STATE.menu = false; hideTT(); render(); }

document.addEventListener("click", (e) => {
  const pick = e.target.closest("#sbPick");
  if (pick) { STATE.menu = !STATE.menu; renderSnapBar(); return; }
  if (e.target.closest("#sbRefresh")) { refreshLatest(); return; }
  if (STATE.menu && !e.target.closest("#snapMenu")) { STATE.menu = false; renderSnapBar(); }
  const nav = e.target.closest("[data-sec]");
  if (nav) { go(+nav.dataset.sec, 0); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) { go(STATE.sec, +tb.dataset.tab); return; }
  const fc = e.target.closest("[data-fc]");
  if (fc) { STATE.fcAll = fc.dataset.fc === "1"; render(); return; }
  const ev = e.target.closest("[data-ev]");
  if (ev) {
    const i = +ev.dataset.ev;
    STATE.evSel = (STATE.evSel === i && !ev.dataset.jump) ? -1 : i;
    if (ev.dataset.jump) go(2, 0); else render();
    return;
  }
  const j = e.target.closest("[data-go]");
  if (j) { const p = j.dataset.go.split("|"); go(+p[0], +p[1]); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && STATE.menu) { STATE.menu = false; renderSnapBar(); return; }
  if (e.key !== "Enter" && e.key !== " ") return;
  const t = e.target.closest && (e.target.closest("[data-go]") || e.target.closest("[data-ev]"));
  if (!t) return;
  e.preventDefault(); t.click();
});

/* =====================================================================
   14. NẠP DỮ LIỆU TĨNH (data.json đóng gói sẵn, sinh lại bởi lệnh resume
   hàng tuần của VP HĐQT - không còn đọc Claude Artifact Database sống)
   ===================================================================== */
function fatal(title, body) {
  document.getElementById("wrap").innerHTML =
    '<div class="state"><h2>' + esc(title) + "</h2><p>" + body + "</p></div>";
  document.getElementById("subtabs").innerHTML = "";
}
async function loadData() {
  const res = await fetch("data.json?v=" + Date.now());
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
async function refreshLatest() {
  if (BUSY) return;
  BUSY = true; DONE_AT = ""; renderSnapBar();
  try {
    const d = await loadData();
    DATA.trends = d.trends; DATA.forecast = d.forecast; DATA.bulletin = d.bulletin; DATA.soi = d.soi || null;
    DATA.index = d.index || null;
    const now = new Date();
    DONE_AT = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
    setTimeout(() => { DONE_AT = ""; renderSnapBar(); }, 6000);
  } catch (e) { console.warn("Tải lại thất bại:", e); }
  BUSY = false; STATE.snap = null; render();
}
async function boot() {
  try {
    const d = await loadData();
    DATA.trends = d.trends; DATA.forecast = d.forecast; DATA.bulletin = d.bulletin; DATA.soi = d.soi || null;
    DATA.index = d.index || null;
  } catch (e) {
    fatal("Lỗi khi tải dữ liệu", '<span class="mono">' + esc(e && e.message ? e.message : e) +
      "</span><br>Thử tải lại trang. Nếu lặp lại, kiểm tra file data.json cùng thư mục.");
    renderSnapBar(); return;
  }
  if (!DATA.trends && !DATA.forecast && !DATA.bulletin && !DATA.soi) {
    fatal("Chưa có dữ liệu", "Tệp data.json chưa có nội dung cho trang này.");
    renderSnapBar(); return;
  }
  render();
}
boot();
</script>
